<form [formGroup]="form">
    <p-floatLabel>
        <input id="nombre" type="text" pInputText formControlName="nombreCargo" />
        <label class="required-label" for="nombre">Nombre cargo</label>
      </p-floatLabel>
      <p-floatLabel>
        <input id="razonSocial" type="text" pInputText formControlName="descripcion" />
        <label class="required-label" for="razonSocial">Descripcion</label>
      </p-floatLabel>
      <p-floatLabel>
        <p-autoComplete
          appendTo="body"
          [dropdown]="true"
          [showClear]="true"
          id="id"
          formControlName="idNivelesRiesgoARL"
          [suggestions]="filteredArl"
          forceSelection="true"
          (completeMethod)="filterArl($event)" 
          field="nombreClase"
          >
        </p-autoComplete>
        <label class="required-label" for="idNivelesRiesgoARL">Clase Arl</label>
      </p-floatLabel>
</form>
<footer>
    <p-button type="button" severity="secondary" (click)="closeDialog(null)">Cancelar</p-button>
    <p-button type="button" (click)="closeDialog(form.value)">{{ editMode ? 'Editar' : 'Crear' }}</p-button>
</footer>
