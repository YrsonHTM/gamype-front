<form [formGroup]="formCesantia">
    <!-- mesnomina -->
    <div class="form-group">
        <div class="row">
            <p-floatLabel>
                <p-calendar 
                appendTo="body"
                formControlName="anio"
                view="year" 
                dateFormat="yy" />
                <label class="required-label" for="titulo">Año</label>
            </p-floatLabel>
        </div>
    </div>
    <footer>
        <p-button type="button" severity="secondary" (click)="closeDialog(null)">Cancelar</p-button>
        <p-button type="button" (click)="closeDialog(formCesantia.value)">Generar</p-button>
    </footer>
</form>
