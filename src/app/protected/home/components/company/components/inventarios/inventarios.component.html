<p-card class="title">
    <h2>
        Elementos de la empresa
    </h2>
</p-card>
<main class="flex f-1">

    <p-card class="flex f-1" styleClass="flex f-1 f-col p-20">
        <p-header class="flex header-table">
            @if( inventarios.length > 5)
            {
            <div class="flex">
                <span class="p-input-icon-left ml-auto">
                    <i class="pi pi-search"></i>
                    <input pInputText type="text" [(ngModel)]="searchValue" (ngModelChange)="dt1.filterGlobal($event, 'contains')" placeholder="Filtrar cargos" />
                </span>
            </div>
            }
            @if(inventarios.length <= 30)
            {
                <p-button (onClick)="crearInventario()" class="flex width-200 flex-end">
                    Crear inventario
                </p-button>
            }
        </p-header>
        <p-table #dt1 [value]="inventarios" [paginator]="inventarios.length > 5" [rows]="5" [rowsPerPageOptions]="[5, 10, 20]" [rows]="5" [rowsPerPageOptions]="[5, 10, 20]" [globalFilterFields]="['nombre', 'direccionFisica', 'fechaCreacionRegistro']">
            <ng-template pTemplate="header">
                <tr>
                    <th>Nombre</th>
                    <th>direccion</th>
                    <th>fecha creacion</th>
                    <th>Acciones</th>
                </tr>
            </ng-template>
            <ng-template pTemplate="body" let-inventario>
                <tr>
                    <td>{{inventario.nombre}}</td>
                    <td>{{inventario?.direccionFisica || 'No hay registro'}}</td>
                    <td>{{(inventario.fechaCreacionRegistro | beatyDate) || 'No hay registro'}}</td>
                    <td class="celda-buttons">
                        <p-button (onClick)="goInventario(inventario)" icon="pi pi-box" class="p-button-rounded p-button-secondary"></p-button>
                        <p-button (onClick)="editarElemento(inventario)" icon="pi pi-pencil" class="p-button-rounded p-button-secondary"></p-button>
                        <p-button (onClick)="eliminarElemento(inventario)" icon="pi pi-trash" class="p-button-rounded p-button-danger"></p-button>
                    </td>
                </tr>
            </ng-template>
        </p-table>
    </p-card>
</main>
