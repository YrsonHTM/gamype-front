<form [formGroup]="form">

    <p-floatLabel class="f-1">
        <input [min]="1" [max]="999999999" id="cantidad" type="number" pInputText formControlName="cantidad" />
        <label for="cantidad">{{ addMode ?  'Existencias a agregar' : 'Existencias a extraer'}}</label>
    </p-floatLabel>

</form>
<footer>
    <p-button type="button" severity="secondary" (click)="closeDialog(null)">Cancelar</p-button>
    <p-button type="button" (click)="closeDialog(form.value)">{{ addMode ? 'Agregar' : 'Extraer' }}</p-button>
</footer>
